name: NoPants 7F Private Transport Security Tests (Synthetic Only)
on:
  push:
    branches: [no-pants-sprint7f-secure-native-puppet]
    paths:
      - tools/nopants7f/**
      - .github/workflows/no-pants-7f-transport-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small CPU test dependencies
        run: python -m pip install pillow cryptography
      - name: Verify synthetic private ZIP and encrypted evidence
        run: python tools/nopants7f/test_private_transport.py
