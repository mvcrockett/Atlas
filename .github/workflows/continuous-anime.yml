name: Phone-First Continuous Anime Engine
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Duration in seconds (5 or 10)"
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
      interpolation:
        description: "CPU method"
        required: true
        default: flow
        type: choice
        options:
          - flow
          - blend
jobs:
  interpolate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU interpolation dependencies
        run: pip install numpy pillow opencv-python-headless imageio imageio-ffmpeg
      - name: Render bounded CPU animation
        run: python continuous_engine/render.py --method ${{ inputs.interpolation || 'flow' }} --seconds ${{ inputs.seconds || '10' }}
      - name: Check movie frame count and metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/continuous_engine')
          m=json.loads((p/'metrics.json').read_text())
          import imageio.v2 as imageio
          expected=int('${{ inputs.seconds || '10' }}')*24
          assert m['frame_count']==expected and len(list((p/'frames').glob('frame_*.png')))==expected
          assert m['fps']==24 and m['seconds']==expected/24
          assert (p/'continuous.mp4').stat().st_size>10000
          reader=imageio.get_reader(str(p/'continuous.mp4'),format='ffmpeg')
          meta=reader.get_meta_data(); assert abs(meta['duration']-expected/24)<0.1,meta
          assert reader.count_frames()==expected
          reader.close()
          assert m['mean_frame_difference']>0.01, 'No measurable motion'
          print('PASS: frame count, 24 fps, duration, MP4 and measurable motion; artistic quality UNVERIFIED.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-anime-cpu-bounded
          path: |
            output/continuous_engine/continuous.mp4
            output/continuous_engine/continuous.gif
            output/continuous_engine/metrics.json
            output/continuous_engine/frames/frame_0000.png
            output/continuous_engine/frames/frame_0030.png
            output/continuous_engine/frames/frame_0060.png
            output/continuous_engine/frames/frame_0090.png
            output/continuous_engine/frames/frame_0239.png
