name: Phone-First Continuous Anime Engine
on:
  workflow_dispatch:
    inputs:
      interpolation:
        description: "CPU method"
        required: true
        default: flow
        type: choice
        options:
          - flow
          - blend
  push:
    paths:
      - continuous_engine/**
      - .github/workflows/continuous-anime.yml
jobs:
  interpolate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU interpolation dependencies
        run: pip install numpy pillow opencv-python-headless imageio imageio-ffmpeg
      - name: Render every frame of five-second movie
        run: python continuous_engine/render.py --method ${{ inputs.interpolation || 'flow' }}
      - name: Check movie frame count and metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/continuous_engine')
          m=json.loads((p/'metrics.json').read_text())
          assert m['frame_count']==120 and len(list((p/'frames').glob('frame_*.png')))==120
          assert (p/'continuous.mp4').stat().st_size>10000
          print('PASS: 120 frames, 24 fps, MP4/GIF exist. Optical flow quality remains unverified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-anime-cpu-120frames
          path: |
            output/continuous_engine/continuous.mp4
            output/continuous_engine/continuous.gif
            output/continuous_engine/metrics.json
            output/continuous_engine/frames/frame_0000.png
            output/continuous_engine/frames/frame_0030.png
            output/continuous_engine/frames/frame_0060.png
            output/continuous_engine/frames/frame_0090.png
            output/continuous_engine/frames/frame_0119.png
