name: NoPants 7I Synthetic Encrypted Input Contract
on:
  push:
    branches: [no-pants-sprint7i-iphone-encryption]
    paths:
      - tools/nopants7i/**
      - .github/workflows/no-pants-7i-encryption-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic-only CPU crypto libraries
        run: python -m pip install --quiet Pillow cryptography
      - name: Test AES-GCM private input compatibility (synthetic only)
        run: python tools/nopants7i/test_ingress_encrypted.py
