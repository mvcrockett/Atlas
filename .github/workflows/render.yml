name: Render free animation
# Phase 4.1 acceptance rerun: no animation source changes
on:
  workflow_dispatch:
  push:
    paths:
      - animate.py
      - studio.py
      - scenes.json
      - characters.py
      - storyboard.json
      - phase4.py
      - phase4.json
      - audio.py
      - audio.json
      - showcase.json
      - anime_layers.py
      - rig2.py
      - rig2.json
      - rig21.py
      - requirements.txt
      - .github/workflows/render.yml
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled open-source FFmpeg without apt
        run: |
          python -m pip install imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg, os, pathlib, shutil
          executable = pathlib.Path(imageio_ffmpeg.get_ffmpeg_exe())
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ffmpeg-bin'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copy2(executable, destination / 'ffmpeg')
          (destination / 'ffmpeg').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as handle:
              handle.write(str(destination) + '\n')
          print('FFmpeg installed:', executable)
          PY
      - name: Verify bundled FFmpeg
        run: |
          command -v ffmpeg
          ffmpeg -version
      - run: pip install -r requirements.txt
      - name: Preserve Phase 1 fish
        run: python animate.py
      - name: Preserve Phase 2 configured scenes
        run: python studio.py --config scenes.json
      - name: Preserve Phase 3 character storyboard
        run: python characters.py --config storyboard.json
      - name: Render Phase 4 expressive storyboard
        run: python phase4.py --config phase4.json
      - name: Render 24fps showcase with existing Phase 4 engine
        run: python phase4.py --config showcase.json
      - name: Render original layered anime-inspired parallax showcase
        run: python anime_layers.py
      - name: Render layered Character Rig 2.0 performance
        run: python rig2.py --config rig2.json
      - name: Generate original RGBA PNG asset pack on disk
        run: python rig21.py --make-demo
      - name: Render imported Character Rig 2.1
        run: python rig21.py --manifest assets/rig21/manifest.json
      - name: Create original audio test tone (no copyrighted material)
        run: python audio.py --make-demo-tone assets/audio/demo_tone.wav
      - name: Render Phase 5 synchronized audio MVP
        run: python audio.py --config audio.json
      - uses: actions/upload-artifact@v4
        with:
          name: no-pants-studio-phase5
          path: |
            output/**/*.gif
            output/**/*.mp4
            output/fish.gif
            output/fish.mp4
