name: Render free animation
on:
  workflow_dispatch:
  push:
    paths:
      - animate.py
      - studio.py
      - scenes.json
      - requirements.txt
      - .github/workflows/render.yml
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Preserve legacy fish render
        run: python animate.py
      - name: Render configured scenes
        run: python studio.py --config scenes.json
      - uses: actions/upload-artifact@v4
        with:
          name: no-pants-studio-animations
          path: |
            output/**/*.gif
            output/**/*.mp4
            output/fish.gif
            output/fish.mp4
