name: Render free animation
on:
  workflow_dispatch:
  push:
    paths:
      - animate.py
      - studio.py
      - scenes.json
      - characters.py
      - storyboard.json
      - phase4.py
      - phase4.json
      - requirements.txt
      - .github/workflows/render.yml
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Preserve Phase 1 fish
        run: python animate.py
      - name: Preserve Phase 2 configured scenes
        run: python studio.py --config scenes.json
      - name: Preserve Phase 3 character storyboard
        run: python characters.py --config storyboard.json
      - name: Render Phase 4 expressive storyboard
        run: python phase4.py --config phase4.json
      - uses: actions/upload-artifact@v4
        with:
          name: no-pants-studio-phase4
          path: |
            output/**/*.gif
            output/**/*.mp4
            output/fish.gif
            output/fish.mp4
